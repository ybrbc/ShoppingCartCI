name: ci.yml
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Run tests
        run: |
          coverage run -m pytest --junitxml=pytest-results.xml
          coverage report --fail-under=80 --include="src/*"
          coverage xml --include="src/*" -o "pycoverage-results.xml"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files:
            pytest-results.xml
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: (!cancelled())
        with:
          filename: pycoverage-results.xml
          format: 'markdown'
          output: 'file'
          thresholds: '80 80'

      - name: Add Coverage to Job Summary
        if: (!cancelled())
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          fi