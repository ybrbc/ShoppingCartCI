name: ci.yml
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'python/src/**'
      - 'python/tests/**'
      - 'python/requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'python/src/**'
              - 'python/tests/**'
              - 'python/requirements.txt'
              - '.github/workflows/**'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt

      - name: Run tests and generate coverage reports
        run: |
          coverage run --source=python/src -m pytest python/tests --junitxml=pytest-results.xml

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files:
            pytest-results.xml

      - name: Check Coverage Threshold
        id: cov_check
        if: (!cancelled())
        run: coverage report --fail-under=80

      - name: Generate and Add Coverage to Job Summary
        if: (!cancelled())
        run: |
          coverage report --format=markdown > code-coverage-results.md
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish Code Coverage Check
        uses: actions/github-script@v7
        if: (!cancelled())
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('code-coverage-results.md', 'utf8');
            const outcome = '${{ steps.cov_check.outcome }}';
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Code Coverage',
              head_sha: sha,
              status: 'completed',
              conclusion: outcome === 'success' ? 'success' : 'failure',
              output: {
                title: 'Code Coverage Report',
                summary: summary
              }
            });