name: ci.yml
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'python/src/**'
      - 'python/tests/**'
      - 'python/requirements.txt'
      - 'java/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      java: ${{ steps.filter.outputs.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'python/src/**'
              - 'python/tests/**'
              - 'python/requirements.txt'
              - '.github/workflows/**'
            java:
              - 'java/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run tests and generate coverage reports
        run: |
          coverage run --source=src -m pytest tests --junitxml=pytest-results.xml

      - name: Publish Test Results (Python)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: Python Test Results
          files: python/pytest-results.xml

      - name: Check Coverage Threshold
        id: cov_check
        if: (!cancelled())
        run: coverage report --fail-under=80

      - name: Generate and Add Coverage to Job Summary
        if: (!cancelled())
        run: |
          coverage report --format=markdown > code-coverage-results.md
          echo "## Python Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish Code Coverage Check (Python)
        uses: actions/github-script@v7
        if: (!cancelled())
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('python/code-coverage-results.md', 'utf8');
            const outcome = '${{ steps.cov_check.outcome }}';
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Python Code Coverage',
              head_sha: sha,
              status: 'completed',
              conclusion: outcome === 'success' ? 'success' : 'failure',
              output: {
                title: 'Python Code Coverage Report',
                summary: summary
              }
            });

  test-java:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java/shoppingcart

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: java/shoppingcart/pom.xml

      - name: Run Maven tests and JaCoCo coverage check
        id: mvn_test
        run: mvn -B test

      - name: Publish Test Results (Java)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          check_name: Java Test Results
          files: java/shoppingcart/target/surefire-reports/TEST-*.xml

      - name: Generate and Publish Java Coverage Report
        uses: actions/github-script@v7
        if: (!cancelled())
        with:
          script: |
            const fs = require('fs');
            const csvPath = 'java/shoppingcart/target/site/jacoco/jacoco.csv';
            let md = '### JaCoCo Coverage Summary\n\n';

            if (fs.existsSync(csvPath)) {
              const lines = fs.readFileSync(csvPath, 'utf8').trim().split('\n');
              md += '| Class | Instructions Covered | Branches Covered |\n|---|---|---|\n';
              let totalMissed = 0, totalCovered = 0;

              for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                const cls = cols[2];
                const iMissed = parseInt(cols[3], 10), iCov = parseInt(cols[4], 10);
                const bMissed = parseInt(cols[5], 10), bCov = parseInt(cols[6], 10);
                totalMissed += iMissed;
                totalCovered += iCov;
                const iPct = ((iCov / (iMissed + iCov)) * 100).toFixed(1) + '%';
                const bPct = (bMissed + bCov) > 0 ? ((bCov / (bMissed + bCov)) * 100).toFixed(1) + '%' : '100%';
                md += `| \`${cls}\` | ${iPct} (${iCov}/${iMissed + iCov}) | ${bPct} |\n`;
              }
              const totalPct = ((totalCovered / (totalMissed + totalCovered)) * 100).toFixed(1) + '%';
              md += `| **Total** | **${totalPct}** | |\n`;
            } else {
              md += 'Coverage report file not found.';
            }

            await core.summary.addRaw(md).write();

            const outcome = '${{ steps.mvn_test.outcome }}';
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Java Code Coverage',
              head_sha: sha,
              status: 'completed',
              conclusion: outcome === 'success' ? 'success' : 'failure',
              output: {
                title: 'Java Code Coverage Report',
                summary: md
              }
            });